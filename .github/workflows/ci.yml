name: CI Pipeline

on:
  push:
    branches: [main, master, feature/*, hireable/*]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Jest Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinic-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: clinic-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest test suite
        run: npm test

      - name: Build NestJS application
        run: npm run build
        env:
          NODE_ENV: production

  frontend-check:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinic-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: clinic-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit
